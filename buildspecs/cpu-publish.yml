version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m venv /tmp/legal-cpu-venv
      - /tmp/legal-cpu-venv/bin/python -m pip install --no-cache-dir -r requirements_cpu.txt
      - /tmp/legal-cpu-venv/bin/python -m pip check
      - aws --version
  build:
    commands:
      - /tmp/legal-cpu-venv/bin/python -m unittest discover -s tests/cpu -v
      - /tmp/legal-cpu-venv/bin/python -m src.cpu.prepare --input-dir dataset_engineering/processed_parquet --output-dir /tmp/legal-cpu-artifacts --source-commit "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - bash setup/publish_cpu_artifacts.sh /tmp/legal-cpu-artifacts

# Set OUTPUT_BUCKET in the CodeBuild project, not in credentials or source.
# Keep CodeBuild's native artifacts setting at NO_ARTIFACTS. The script uses
# scoped S3 access and verifies actual uploaded bytes in this AWS build.
# Upload is a build command: it is never run as an unconditional post_build.
